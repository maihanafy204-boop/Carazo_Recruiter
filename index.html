<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Recruiter Assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--bg:#fdf7f2;--card:#fff;--tx:#4a3c34;--mut:#7d6e66;--ac:#e8691f;--bd:#ecd9cc;--no:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#1c1714;--card:#2a221d;--tx:#f3ebe5;--mut:#b5a69c;--ac:#f08a4b;--bd:#463a32;--no:#f08a82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 8px}h2{font-size:17px;font-weight:500;margin:0 0 10px}
p{margin:8px 0}.mut{color:var(--mut);font-size:14px}.err{color:var(--no);font-size:14px;min-height:20px}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px;cursor:pointer;margin-top:8px;font-family:inherit}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin:8px 0;line-height:1.4}
.opt:hover,.opt:active{border-color:var(--ac)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.t.low{color:var(--no);font-weight:600}
.row{display:flex;gap:8px;margin-bottom:8px}
</style></head><body><main>
<div style="font-size:30px;font-weight:800;letter-spacing:-1px;margin-bottom:12px"><span style="color:var(--ac)">C</span>ara<span style="color:var(--ac)">zo</span></div>
<div id="app"></div></main>
<script>
const API="https://script.google.com/macros/s/AKfycbxhLZ0tj8TWvNxPfPfOtHb-5wvfhK9kSyJkOmhPPDg66kDKyUYQw_q2W9rOR5KYzGo3Bg/exec";
const TL=120;
const T={
en:{h:"Welcome",i:["This assessment presents 20 workplace situations. For each one, choose the action you think is best.","Please answer on your own, without help or outside tools. There are no trick questions.","Time: about 30 minutes. You have 2 minutes for each question.","Your answers are confidential and used only for this selection process. If you need extra time or support, tell your recruiter before you start."],nm:"Full name",em:"Email",go:"Start",q:"Question",of:"of",need:"Please enter your name, a valid email and your country.",co:"Country where you live",co2:"Type your country",ty:"Thank you",done:"You have completed the assessment. Our team will review your answers and contact you about the next steps.",fail:"We could not save your answers. Please check your internet connection and try again.",retry:"Try again",saving:"Saving your answers..."},
es:{h:"Bienvenido/a",i:["Esta evaluación presenta 20 situaciones de trabajo. En cada una, elija la acción que considere mejor.","Responda por su cuenta, sin ayuda ni herramientas externas. No hay preguntas con trampa.","Duración: unos 30 minutos. Tiene 2 minutos por pregunta.","Sus respuestas son confidenciales y se usan solo para este proceso de selección. Si necesita más tiempo o apoyo, avise a su reclutador antes de empezar."],nm:"Nombre completo",em:"Correo electrónico",go:"Comenzar",q:"Pregunta",of:"de",need:"Escriba su nombre, un correo electrónico válido y su país.",co:"País donde vive",co2:"Escriba su país",ty:"Gracias",done:"Ha completado la evaluación. Nuestro equipo revisará sus respuestas y le contactará sobre los siguientes pasos.",fail:"No pudimos guardar sus respuestas. Revise su conexión a internet e intente de nuevo.",retry:"Intentar de nuevo",saving:"Guardando sus respuestas..."}};
const Q=[[["It is Monday. This week you must deliver: 10 Sales Agents (60 applicants waiting), 1 Sales Supervisor (no candidates yet) and 1 Support role (2 strong candidates ready). What is the best plan for today?","Es lunes. Esta semana debe entregar: 10 Agentes de Ventas (60 postulantes esperando), 1 Supervisor de Ventas (aún sin candidatos) y 1 puesto de Soporte (2 candidatos fuertes listos). ¿Cuál es el mejor plan para hoy?"],[["Book the Support interviews and screen the sales applicants first, then start the Supervisor search tomorrow","Agendar las entrevistas de Soporte y revisar primero a los postulantes de ventas, y empezar mañana con el Supervisor"],["Ask the Director which role matters most and wait for the answer before you start any work","Preguntar al Director qué puesto es más importante y esperar la respuesta antes de empezar cualquier trabajo"],["Fully screen all 60 sales applicants first, because they are the largest group of the three","Revisar a fondo a los 60 postulantes de ventas primero, porque son el grupo más grande de los tres"],["Start sourcing the Supervisor, book the 2 Support interviews, and screen the sales applicants in short blocks","Empezar a buscar al Supervisor, agendar las 2 entrevistas de Soporte y revisar a los postulantes de ventas en bloques cortos"]]],[["A candidate for an important role withdraws. The final interview is in 2 hours and the hiring manager is waiting. What do you do?","Un candidato para un puesto importante se retira. La entrevista final es en 2 horas y el gerente está esperando. ¿Qué hace?"],[["Put the next candidate in the slot and tell the manager only after the interview is finished","Poner al siguiente candidato en ese horario y avisar al gerente solo después de terminada la entrevista"],["Tell the manager now and ask for more time while you restart the search from the beginning","Avisar ahora al gerente y pedir más tiempo mientras usted reinicia la búsqueda desde el principio"],["Tell the manager now, offer new times with the next strong candidates, and record the reason in Workable","Avisar al gerente ahora, ofrecer nuevos horarios con los siguientes buenos candidatos y registrar el motivo en Workable"],["Call the candidate first to try to keep them in the process, then tell the manager what happened","Llamar primero al candidato para intentar mantenerlo en el proceso y luego contarle al gerente lo ocurrido"]]],[["It is the 15th of the month. Your target is 8 hires and you have made 2. Six offers are still pending. What do you do?","Es el día 15 del mes. Su meta es 8 contrataciones y lleva 2. Hay seis ofertas pendientes. ¿Qué hace?"],[["Count people who accepted verbally as hires so that your numbers look closer to the target for the month","Contar como contrataciones a quienes aceptaron verbalmente para que sus cifras se vean más cerca de la meta del mes"],["Open searches for new roles so that the pipeline grows, and report the final result at the end of the month","Abrir búsquedas para nuevos puestos para que crezca el flujo de candidatos e informar el resultado final a fin de mes"],["Ask your Director to lower the target now, because the first half of the month was slower than planned","Pedir a su Director que baje la meta ahora, porque la primera mitad del mes fue más lenta de lo planeado"],["Follow up on the 6 pending offers first, push the strongest roles in the pipeline, and tell your Director the gap and plan","Dar seguimiento primero a las 6 ofertas pendientes, impulsar los puestos más avanzados y decir a su Director la brecha y el plan"]]],[["The CEO asks for the status of every role within 30 minutes. Your Workable data is not fully up to date. What do you do?","El CEO pide el estado de todas las vacantes en 30 minutos. Sus datos en Workable no están totalmente al día. ¿Qué hace?"],[["Send last week’s report with a short note saying that some of the numbers have changed since","Enviar el informe de la semana pasada con una nota breve que diga que algunas cifras han cambiado desde entonces"],["Ask for more time until every record in Workable is completely updated and checked by you first","Pedir más tiempo hasta que todos los registros de Workable estén completamente actualizados y revisados por usted"],["Fill the gaps with your own estimates so that the report looks complete when it is sent to the CEO","Llenar los vacíos con sus propias estimaciones para que el informe se vea completo al enviarlo al CEO"],["Update the critical roles first, send what is confirmed, and mark unknown items with a time for the rest","Actualizar primero las vacantes críticas, enviar lo confirmado e indicar lo pendiente con una hora de entrega"]]],[["A key engineering role in Germany has almost no applicants after 2 weeks. What is the best next step?","Un puesto clave de ingeniería en Alemania casi no tiene postulantes después de 2 semanas. ¿Cuál es el mejor siguiente paso?"],[["Ask employees for referrals and wait a few weeks to see whether any names arrive from them","Pedir referidos a los empleados y esperar unas semanas para ver si llega algún nombre por esa vía"],["Search directly for passive candidates, send short personal messages, test two message versions, and track replies each day","Buscar directamente candidatos pasivos, enviar mensajes personales cortos, probar dos versiones del mensaje y medir las respuestas cada día"],["Lower the requirements so that more applicants qualify, and tell the manager after the shortlist is ready","Bajar los requisitos para que más postulantes califiquen y avisar al gerente cuando la lista corta esté lista"],["Repost the ad on more job boards and ask the agency to send CVs as soon as it is able to find any","Volver a publicar el anuncio en más bolsas de empleo y pedir a la agencia que envíe CV en cuanto pueda encontrarlos"]]],[["An agency sent 15 CVs in 3 weeks and only 1 was qualified. Its fee is high. What do you do?","Una agencia envió 15 CV en 3 semanas y solo 1 estaba calificado. Su tarifa es alta. ¿Qué hace?"],[["Share the numbers, agree clearer criteria and a 2-week test, and stop if the results stay weak","Compartir las cifras, acordar criterios más claros y una prueba de 2 semanas, y dejarla si los resultados siguen débiles"],["Send all 15 CVs to the hiring manager so that the manager can choose the ones that look best","Enviar los 15 CV al gerente para que él elija los que le parezcan mejores"],["Keep the agency because it sends CVs quickly, and do all of the screening of those CVs yourself","Mantener la agencia porque envía CV rápido, y hacer usted mismo todo el filtrado de esos CV"],["Stop using the agency now and look for a new one, without giving any feedback to the old agency","Dejar de usar la agencia ahora y buscar una nueva, sin dar ningún comentario a la agencia anterior"]]],[["Four candidates in a row decline your offers because the pay is too low. What do you do first?","Cuatro candidatos seguidos rechazan sus ofertas porque el pago es bajo. ¿Qué hace primero?"],[["Offer the next candidates a higher salary yourself so that you can close the open roles quickly","Ofrecer usted mismo un salario más alto a los próximos candidatos para cerrar rápido las vacantes abiertas"],["Ask the candidates what they expected, compare with competitor job ads, and show the evidence to your Director","Preguntar a los candidatos qué esperaban, comparar con anuncios de la competencia y mostrar la evidencia a su Director"],["Ask the hiring manager to raise the pay range for this role so that the next offers are accepted","Pedir al gerente que suba el rango de pago de este puesto para que las próximas ofertas sean aceptadas"],["Explain the full benefits package more clearly to candidates in the next offers that you send out","Explicar con más claridad el paquete completo de beneficios a los candidatos en las próximas ofertas que envíe"]]],[["A strong candidate for a US role lives in another country and has no US work permit. The company cannot sponsor visas. What do you do?","Un candidato fuerte para un puesto en EE. UU. vive en otro país y no tiene permiso de trabajo allí. La empresa no puede patrocinar visas. ¿Qué hace?"],[["Send the offer and let HR deal with the work permit after the candidate has already accepted it","Enviar la oferta y dejar que RR. HH. resuelva el permiso de trabajo después de que el candidato la acepte"],["Tell the candidate the limit now, ask HR or legal about the options, and decide the next step with the manager","Decir ya al candidato la limitación, consultar las opciones con RR. HH. o legal y decidir el siguiente paso con el gerente"],["Ask the candidate to check the visa rules alone and to come back to you when they have an answer","Pedir al candidato que revise por su cuenta las reglas de visa y vuelva con usted cuando tenga una respuesta"],["Pause the process and ask the manager to find another candidate who already has the right to work there","Pausar el proceso y pedir al gerente que busque otro candidato que ya tenga derecho a trabajar allí"]]],[["Sales role. Candidate A can start in 1 week but has an unexplained 8-month gap and gave vague answers. Candidate B needs 4 weeks and gave clear examples with numbers. The manager is in a hurry. What do you do?","Puesto de ventas. El candidato A puede empezar en 1 semana, pero tiene un vacío de 8 meses sin explicar y dio respuestas vagas. El candidato B necesita 4 semanas y dio ejemplos claros con números. El gerente tiene prisa. ¿Qué hace?"],[["Send only B to the manager and explain to the manager why the start date is further away","Enviar solo a B al gerente y explicarle por qué la fecha de inicio es más lejana"],["Send both candidates to the manager, recommend B, and explain the risks that you see with A","Enviar a ambos candidatos al gerente, recomendar a B y explicar los riesgos que usted ve con A"],["Send A first because the manager needs someone quickly and B can be kept as a backup option","Enviar primero a A porque el gerente necesita a alguien rápido, y mantener a B como opción de respaldo"],["Ask A about the gap and for examples today, then send the best candidates with a clear recommendation","Preguntar a A por el vacío y pedirle ejemplos hoy, y luego enviar a los mejores con una recomendación clara"]]],[["A hiring manager says: “Do not send candidates with long career gaps or small children. They miss too much work.” What do you do?","Un gerente dice: “No me envíe candidatos con largos vacíos laborales o hijos pequeños. Faltan demasiado”. ¿Qué hace?"],[["Explain this is discrimination, then agree job-related criteria such as schedule and attendance for all","Explicar que eso es discriminación y acordar criterios del puesto, como horario y asistencia, para todos"],["Apply the rule quietly when you screen, and keep it out of your notes so that nobody can question it","Aplicar la regla en silencio al filtrar y no anotarla, para que nadie pueda cuestionarla"],["Send the comment to HR and pause the whole search until HR gives you an answer about what to do","Enviar el comentario a Recursos Humanos y pausar toda la búsqueda hasta que le den una respuesta"],["Screen on skills only and do not discuss the comment with the manager in order to avoid a conflict","Filtrar solo por habilidades y no comentar lo dicho con el gerente para evitar un conflicto"]]],[["You receive 60 applications for one role and have little time. What is the best first step?","Recibe 60 postulaciones para un puesto y tiene poco tiempo. ¿Cuál es el mejor primer paso?"],[["Call the applicants in the order in which they applied until you have found enough good people","Llamar a los postulantes en el orden en que aplicaron hasta encontrar suficientes buenas personas"],["Start with candidates who worked at well-known companies, because that saves time when you screen","Empezar con candidatos que trabajaron en empresas conocidas, porque eso ahorra tiempo al filtrar"],["Agree must-have criteria with the manager, screen against them, and call the best matches first","Acordar con el gerente los requisitos indispensables, filtrar según ellos y llamar primero a los mejores"],["Review all the CVs quickly and send the 10 strongest ones to the manager for the manager to choose","Revisar rápido todos los CV y enviar los 10 más fuertes al gerente para que él elija"]]],[["Your scorecard shows a candidate cannot work the required schedule. The manager liked him in the interview and says: “Let us move forward with him.” What do you do?","Su scorecard muestra que un candidato no puede cumplir el horario requerido. Al gerente le gustó en la entrevista y dice: “Sigamos adelante con él”. ¿Qué hace?"],[["Move him forward, because the hiring manager is the one who decides whether the candidate fits","Avanzar con él, porque el gerente es quien decide si el candidato encaja en el puesto"],["Change a few of the scores in the scorecard so that he passes and the conflict is avoided","Cambiar algunas puntuaciones del scorecard para que él pase y se evite el conflicto"],["Show the scorecard gap, agree what can be flexible, and ask your Director to decide if you still disagree","Mostrar la brecha del scorecard, acordar qué puede ser flexible y pedir a su Director que decida si siguen en desacuerdo"],["Reject him because of the scorecard and inform the manager about the decision only afterwards","Rechazarlo por el scorecard e informar al gerente de la decisión solo después de tomarla"]]],[["A manager says no to 4 good candidates in a row and gives unclear reasons. What do you do?","Un gerente rechaza a 4 buenos candidatos seguidos y da razones poco claras. ¿Qué hace?"],[["Send 2 or 3 more candidates with notes that explain how each one matches the requirements","Enviar 2 o 3 candidatos más con notas que expliquen cómo cada uno cumple los requisitos"],["Tell your Director that the manager is slowing down the search and ask the Director to step in","Decir a su Director que el gerente está retrasando la búsqueda y pedirle que intervenga"],["Ask for specific reasons, review 2 profiles together, and adjust the hiring brief if needed","Pedir razones específicas, revisar 2 perfiles juntos y ajustar la descripción de búsqueda si hace falta"],["Lower the standard and send candidates that the manager is more likely to accept this time","Bajar el nivel y enviar candidatos que el gerente tenga más probabilidad de aceptar esta vez"]]],[["A manager changes the role requirements when you already have 3 finalists. What do you do?","Un gerente cambia los requisitos del puesto cuando ya tiene 3 finalistas. ¿Qué hace?"],[["Restart the search at once and tell the candidates nothing, because the new search will be quick","Reiniciar la búsqueda de inmediato y no decir nada a los candidatos, porque la nueva búsqueda será rápida"],["Show the effect on time and candidates, agree the change in writing, and keep current candidates informed","Mostrar el efecto en tiempo y candidatos, acordar el cambio por escrito y mantener informados a los candidatos actuales"],["Finish the process with the 3 finalists and use the new requirements only for the next search","Terminar el proceso con los 3 finalistas y usar los nuevos requisitos solo en la próxima búsqueda"],["Restart the search with the new requirements and tell the candidates that the process has changed","Reiniciar la búsqueda con los nuevos requisitos y avisar a los candidatos que el proceso cambió"]]],[["The HR Director asks you directly to stop a Panama vacancy and prepare a report instead. Your reporting line is the Global Director of Talent Acquisition. What do you do?","El Director de RR. HH. le pide directamente que detenga una vacante de Panamá y prepare un informe. Su línea de reporte es el Director Global de Adquisición de Talento. ¿Qué hace?"],[["Decline the request, because you report only to the Global Director of Talent Acquisition","Rechazar la petición, porque usted solo reporta al Director Global de Adquisición de Talento"],["Do both tasks quietly and do not tell either of the two directors about the other request","Hacer ambas tareas en silencio y no decir a ninguno de los dos directores lo del otro pedido"],["Follow the request right away, because the HR Director is also a director in the company","Cumplir la petición de inmediato, porque el Director de RR. HH. también es director en la empresa"],["Agree to help, tell your own Director right away, and follow the priority that your Director confirms","Aceptar ayudar, avisar de inmediato a su propio Director y seguir la prioridad que su Director confirme"]]],[["A manager wants to promise a candidate the job by phone today, before the pay and contract are approved. What do you do?","Un gerente quiere prometer el puesto a un candidato por teléfono hoy, antes de que se aprueben el pago y el contrato. ¿Qué hace?"],[["Ask the manager to wait for the approval to arrive, even if it takes several days to come","Pedir al gerente que espere a que llegue la aprobación, aunque tarde varios días en llegar"],["Let the manager say it is “subject to approval” and send the written offer a few days later","Dejar que el gerente diga que está “sujeta a aprobación” y enviar la oferta escrita unos días después"],["Explain the risk, ask for approval today, and send a written offer once it is approved","Explicar el riesgo, pedir la aprobación hoy y enviar una oferta escrita cuando se apruebe"],["Let the manager make the call, because these approvals are usually given in the end anyway","Dejar que el gerente haga la llamada, porque estas aprobaciones normalmente se dan al final"]]],[["A candidate must start in 3 days. One of the two reference checks is still pending. What do you do?","Un candidato debe empezar en 3 días. Una de las dos verificaciones de referencias sigue pendiente. ¿Qué hace?"],[["Send an unconditional offer and complete the pending checks only after the person has started","Enviar una oferta sin condiciones y completar las verificaciones pendientes solo cuando la persona haya empezado"],["Hold the offer until every single check is complete, even if the start date has to move later","Retener la oferta hasta completar cada verificación, aunque la fecha de inicio tenga que moverse"],["Skip the pending reference because the first reference was very good and the manager wants speed","Omitir la referencia pendiente porque la primera fue muy buena y el gerente quiere rapidez"],["Send the written offer as conditional on satisfactory references and checks, and finish the pending one fast","Enviar la oferta escrita condicionada a referencias y verificaciones satisfactorias, y cerrar rápido la pendiente"]]],[["A hiring manager asks you to send candidate CVs on WhatsApp to decide faster. What do you do?","Un gerente le pide enviar CV de candidatos por WhatsApp para decidir más rápido. ¿Qué hace?"],[["Send the CVs on WhatsApp because the manager needs to decide quickly and speed matters the most","Enviar los CV por WhatsApp porque el gerente necesita decidir rápido y la rapidez es lo más importante"],["Decline WhatsApp, share the shortlist in Workable or approved Company email, and offer a quick call","Rechazar WhatsApp, compartir la lista corta en Workable o en el correo aprobado de la empresa y ofrecer una llamada"],["Ask your Director whether WhatsApp is allowed for this one time and wait for the answer to come","Preguntar a su Director si WhatsApp se permite solo por esta vez y esperar a que llegue la respuesta"],["Offer to explain the key points over a call and share the full CVs later through approved systems","Ofrecer explicar los puntos clave en una llamada y compartir los CV completos después por sistemas aprobados"]]],[["Last month, Sales Agent hiring: 120 applicants, 40 phone screens, 20 interviews, 8 offers, 4 accepted. The target offer acceptance rate is 80%. Which problem do you act on first?","El mes pasado, contratación de Agentes de Ventas: 120 postulantes, 40 llamadas de filtro, 20 entrevistas, 8 ofertas, 4 aceptadas. La meta de aceptación de ofertas es 80%. ¿Qué problema atiende primero?"],[["Total applicants: post more job ads to get a bigger pool of people at the top of the funnel","Total de postulantes: publicar más anuncios para tener un grupo más grande al inicio del embudo"],["Offer acceptance: 4 of 8 is 50%. Ask who declined and why, and check pay and start dates","Aceptación de ofertas: 4 de 8 es 50%. Preguntar quién rechazó y por qué, y revisar pago y fechas de inicio"],["Applicants to phone screens: only 1 in 3 passes, so tighten the wording of the job ad that you use","Postulantes a llamadas: solo 1 de cada 3 pasa, así que ajustar la redacción del anuncio que se usa"],["Interview to offer: only 8 of 20 interviewed people got offers, so review the interview scorecard in detail","Entrevista a oferta: solo 8 de 20 entrevistados recibieron oferta, así que revisar el scorecard de entrevistas"]]],[["This month you spent USD 900 on job boards, USD 2,400 on an agency and USD 600 on social ads. You made 6 hires and found 15 qualified candidates. What is the cost per hire?","Este mes gastó USD 900 en bolsas de empleo, USD 2,400 en una agencia y USD 600 en anuncios sociales. Logró 6 contrataciones y encontró 15 candidatos calificados. ¿Cuál es el costo por contratación?"],[["USD 260","USD 260"],["USD 3,900","USD 3,900"],["USD 650","USD 650"],["USD 1,300","USD 1,300"]]]];
const C=[["Argentina","Argentina"],["Bolivia","Bolivia"],["Brazil","Brasil"],["Chile","Chile"],["Colombia","Colombia"],["Costa Rica","Costa Rica"],["Cuba","Cuba"],["Dominican Republic","República Dominicana"],["Ecuador","Ecuador"],["El Salvador","El Salvador"],["Guatemala","Guatemala"],["Honduras","Honduras"],["Mexico","México"],["Nicaragua","Nicaragua"],["Panama","Panamá"],["Paraguay","Paraguay"],["Peru","Perú"],["Uruguay","Uruguay"],["Venezuela","Venezuela"],["Other (non-Latin America)","Otro (fuera de América Latina)"]];
const app=document.getElementById("app");
let st={i:0,ans:[],tm:[],ord:{},name:"",email:"",country:"",other:"",lang:"en",left:TL,timer:null,t0:0,sent:false};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=()=>T[st.lang],li=()=>st.lang==="es"?1:0;
function start(msg){
 const t=L();
 app.innerHTML=`<div class="card"><h1>${t.h}</h1><div class="row"><button class="${st.lang==="en"?"":"sec"}" data-l="en">English</button><button class="${st.lang==="es"?"":"sec"}" data-l="es">Español</button></div>${t.i.map(x=>`<p>${x}</p>`).join("")}<input id="nm" placeholder="${t.nm}" value="${esc(st.name)}" autocomplete="name"><input id="em" type="email" placeholder="${t.em}" value="${esc(st.email)}" autocomplete="email"><select id="co"><option value="">${t.co}</option>${C.map(c=>`<option value="${c[0]}"${st.country===c[0]?" selected":""}>${c[li()]}</option>`).join("")}</select><input id="co2" placeholder="${t.co2}" value="${esc(st.other)}" style="display:${st.country&&st.country.indexOf("Other")===0?"block":"none"}"><p class="err" id="er">${msg||""}</p><button id="go">${t.go}</button></div>`;
 const keep=()=>{st.name=document.getElementById("nm").value.trim();st.email=document.getElementById("em").value.trim();st.country=document.getElementById("co").value;st.other=document.getElementById("co2").value.trim()};
 app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{keep();st.lang=b.dataset.l;start()});
 document.getElementById("co").onchange=e=>{document.getElementById("co2").style.display=e.target.value.indexOf("Other")===0?"block":"none"};
 document.getElementById("go").onclick=()=>{keep();if(!st.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.email)||!st.country||(st.country.indexOf("Other")===0&&!st.other)){start(t.need);return}Object.assign(st,{i:0,ans:[],tm:[],ord:{},sent:false,sid:Date.now().toString(36)+Math.random().toString(36).slice(2,10)});ask()};
}
function ask(){
 const q=Q[st.i],t=L(),k=li();
 if(!st.ord[st.i])st.ord[st.i]=q[1].map((_,x)=>x).sort(()=>Math.random()-.5);
 st.left=TL;st.t0=Date.now();
 app.innerHTML=`<div class="card"><div class="top"><span>${t.q} ${st.i+1} ${t.of} ${Q.length}</span><span class="t" id="tt">${TL}s</span></div><div class="bar"><i style="width:${st.i/Q.length*100}%"></i></div><h2>${esc(q[0][k])}</h2>${st.ord[st.i].map(j=>`<button class="opt" data-k="${j}">${esc(q[1][j][k])}</button>`).join("")}</div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>next(+b.dataset.k));
 clearInterval(st.timer);
 st.timer=setInterval(()=>{st.left--;const e=document.getElementById("tt");if(e){e.textContent=st.left+"s";if(st.left<=20)e.classList.add("low")}if(st.left<=0)next(null)},1000);
}
function next(k){
 clearInterval(st.timer);
 st.ans.push(k);st.tm.push(Math.min(TL,Math.round((Date.now()-st.t0)/1000)));
 st.i++;st.i<Q.length?ask():send();
}
function send(){
 const t=L();
 app.innerHTML=`<div class="card"><p>${t.saving}</p></div>`;
 const p={sid:st.sid,name:st.name,email:st.email,country:(st.country.indexOf("Other")===0?"Other: "+st.other:st.country),lang:st.lang,answers:st.ans,times:st.tm};
 post(p);
}
async function post(p){
 if(API.indexOf("PASTE")===0){app.innerHTML='<div class="card"><p class="err">Setup is not finished: the Web App URL is missing in index.html.</p></div>';return}
 const body=JSON.stringify(p);
 try{
  const r=await fetch(API,{method:"POST",body});
  const j=await r.json();
  finish(!!(j&&j.ok));
 }catch(e){
  try{await fetch(API,{method:"POST",body,mode:"no-cors"});finish(true)}catch(e2){finish(false)}
 }
}
function finish(ok){
 const t=L();
 if(ok){app.innerHTML=`<div class="card"><h1>${t.ty}, ${esc(st.name.split(" ")[0])}</h1><p>${t.done}</p></div>`;return}
 app.innerHTML=`<div class="card"><p class="err">${t.fail}</p><button id="rt">${t.retry}</button></div>`;
 document.getElementById("rt").onclick=send;
}
start();
</script></body></html>
